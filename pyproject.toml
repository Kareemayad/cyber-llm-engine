[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-llm-engine"
version = "0.1.0"
description = "Modular LLM engine for cybersecurity (Phase 1: MITRE Expert)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
